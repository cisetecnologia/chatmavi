<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mavi | Atendimento MAVI Rastreamento Veicular</title><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030812;--c:#19b8f0;--c2:#5ee0ff;--t:#eaf4ff;--m:#8ba3c0;--b:rgba(120,190,255,.16)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(900px 520px at 75% -10%,#0b2a55,transparent 60%),radial-gradient(700px 400px at 10% 110%,#0a2447,transparent 60%),var(--bg);color:var(--t);font-family:Manrope,"Segoe UI",system-ui,sans-serif;font-weight:400;display:grid;place-items:center;overflow:hidden}
.app{position:relative;width:min(460px,100%);height:min(780px,100dvh);display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:#07142a;border:1px solid rgba(94,224,255,.3);box-shadow:0 40px 100px -30px #000,0 0 80px -30px var(--c);padding-bottom:env(safe-area-inset-bottom,0px)}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:linear-gradient(135deg,#0b2a55,#0a1a36);border-bottom:1px solid var(--b)}
.chav{position:relative;width:44px;height:44px;flex:none}.chav svg{width:100%;height:100%;display:block}.chav::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#2cf58a;border:2px solid #0a1a36}
.ch b{display:block;font-size:15px;font-weight:600}.ch small{display:block;color:#2cf58a;font-size:11px}.ch small.ty{color:var(--c2)}.ch em{display:block;font-size:10px;color:var(--m);font-style:normal;margin-top:1px}.sp{flex:1}.ch button{background:none;border:0;color:#cfe3f7;font-size:17px;cursor:pointer;padding:4px 6px}
.cb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.m{max-width:84%;padding:11px 14px;border-radius:17px;font-size:14.5px;line-height:1.5;animation:mi .3s}.m.b{background:#10284d;border:1px solid var(--b);border-bottom-left-radius:4px}.m.u{background:linear-gradient(135deg,#1c5da8,var(--c2));color:#021326;border-bottom-right-radius:4px;align-self:flex-end;font-weight:500}@keyframes mi{from{opacity:0;transform:translateY(8px)}}
.r{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:92%}.r .m{max-width:none}.av{width:30px;height:30px;flex:none}.av svg{width:100%;height:100%;display:block}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--c2);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{50%{transform:translateY(-4px);opacity:.4}}
.cq{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}.cq button,.cq a{border:1px solid var(--c2);background:rgba(94,224,255,.08);color:var(--c2);padding:9px 15px;border-radius:99px;font:500 13.5px Manrope,sans-serif;cursor:pointer;text-decoration:none}.cq button:hover{background:rgba(94,224,255,.18)}.cq a.go{background:#25d366;border-color:#25d366;color:#04210f;font-weight:700}
.cf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--b)}.cf input{flex:1;min-width:0;background:#06142a;border:1px solid var(--b);border-radius:99px;padding:12px 16px;color:#fff;font:400 16px Manrope,sans-serif;outline:0}.cf input:focus{border-color:var(--c2)}.cf button{border:0;border-radius:50%;width:44px;height:44px;background:linear-gradient(135deg,#1c5da8,var(--c2));color:#021326;font-size:18px;cursor:pointer}
.dir{display:block;text-align:center;padding:0 10px 12px;font-size:12px;color:var(--m);text-decoration:none}.dir:hover{color:var(--c2)}
.intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;background:radial-gradient(500px 360px at 50% 30%,#0f3768,#07142a 70%);transition:opacity .5s,visibility .5s}.intro.off{opacity:0;visibility:hidden}
.intro img{height:210px;width:auto;filter:drop-shadow(0 18px 34px rgba(25,184,240,.55));animation:fl 6s ease-in-out infinite}@keyframes fl{50%{translate:0 -12px}}
.intro h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:6px}.intro p{color:var(--m);font-size:14.5px;max-width:320px;line-height:1.55}
.intro button{margin-top:8px;border:0;border-radius:99px;padding:15px 30px;font:600 15px Manrope,sans-serif;color:#021326;background:linear-gradient(135deg,#1c5da8,var(--c2));cursor:pointer;box-shadow:0 12px 36px -8px var(--c);transition:.2s}.intro button:hover{transform:translateY(-2px)}
.intro small{color:var(--m);font-size:11px;opacity:.8}
@media(max-width:520px){.app{border-radius:0;border:0;height:100dvh}}
.m.b.fc{padding:0;overflow:hidden;min-width:250px;max-width:100%}.fh{padding:11px 14px;background:linear-gradient(135deg,#1c5da8,#5ee0ff);color:#021326;font-weight:700;font-size:12px;letter-spacing:.12em}.fr{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(120,190,255,.14);font-size:13px}.fr:last-child{border-bottom:0}.fr i{font-style:normal;flex:none}.fr span{color:#8ba3c0;font-size:11px;min-width:92px}.fr b{font-weight:600;word-break:break-word}.m b{font-weight:700}</style></head><body>
